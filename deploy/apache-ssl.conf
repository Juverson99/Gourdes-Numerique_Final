# deploy/apache-ssl.conf
# ------------------------------------------------------------------
# Modèle de VirtualHost Apache pour Gourde Numérique en HTTPS.
# À adapter (domaine, chemins) puis copier dans le dossier de configuration
# des sites Apache, par ex. :
#   /etc/apache2/sites-available/gourde-numerique.conf   (Debian/Ubuntu)
#   /etc/httpd/conf.d/gourde-numerique.conf               (RHEL/CentOS/AlmaLinux)
#
# Modules requis : mod_ssl, mod_rewrite, mod_headers
#   a2enmod ssl rewrite headers && systemctl reload apache2
#
# Activation (Debian/Ubuntu) :
#   a2ensite gourde-numerique.conf && systemctl reload apache2
# ------------------------------------------------------------------

# --- Port 80 : redirige tout vers HTTPS (sauf le challenge ACME de Let's
#     Encrypt, nécessaire pour obtenir/renouveler le certificat) ---
<VirtualHost *:80>
    ServerName votre-domaine.tld
    ServerAlias www.votre-domaine.tld

    # Nécessaire pour le renouvellement automatique Certbot en mode webroot
    Alias /.well-known/acme-challenge/ /var/www/gourde-numerique/public/.well-known/acme-challenge/
    <Directory "/var/www/gourde-numerique/public/.well-known/acme-challenge/">
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

# --- Port 443 : le site réel, chiffré ---
<VirtualHost *:443>
    ServerName votre-domaine.tld
    ServerAlias www.votre-domaine.tld

    # DocumentRoot = public/, JAMAIS la racine du projet (config/, *.sql,
    # migrations doivent rester hors de portée du navigateur).
    DocumentRoot /var/www/gourde-numerique/public

    <Directory /var/www/gourde-numerique/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # ---------------- TLS ----------------
    SSLEngine on

    # Certificat "réel" (Let's Encrypt, ou fourni par une autorité payante) :
    # SSLCertificateFile      /etc/letsencrypt/live/votre-domaine.tld/fullchain.pem
    # SSLCertificateKeyFile   /etc/letsencrypt/live/votre-domaine.tld/privkey.pem

    # Certificat auto-signé (développement/tests uniquement — voir
    # deploy/generate-self-signed-cert.sh) :
    SSLCertificateFile      /etc/ssl/gourde-numerique/server.crt
    SSLCertificateKeyFile   /etc/ssl/gourde-numerique/server.key
    # Si le certificat est signé par une autorité intermédiaire (fichier
    # bundle/chain fourni par l'autorité), décommenter :
    # SSLCertificateChainFile /etc/ssl/gourde-numerique/chain.pem

    # Protocoles et suites de chiffrement modernes uniquement (désactive
    # SSLv3/TLS 1.0/1.1, obsolètes et vulnérables — POODLE, BEAST...).
    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    SSLHonorCipherOrder     on
    SSLCompression          off
    SSLSessionTickets       off

    # Indique à l'application (via config/config.php > getenv('FORCE_HTTPS'))
    # que HTTPS est bien en place : active la redirection HTTP->HTTPS côté
    # PHP en plus de celle du VirtualHost port 80 ci-dessus, et l'en-tête HSTS.
    SetEnv FORCE_HTTPS 1

    ErrorLog  ${APACHE_LOG_DIR}/gourde-numerique-error.log
    CustomLog ${APACHE_LOG_DIR}/gourde-numerique-access.log combined
</VirtualHost>
