# deploy/nginx-ssl.conf
# ------------------------------------------------------------------
# Modèle de configuration Nginx pour Gourde Numérique en HTTPS, avec PHP-FPM.
# À adapter (domaine, chemins, version de socket PHP-FPM) puis copier dans :
#   /etc/nginx/sites-available/gourde-numerique.conf   (Debian/Ubuntu)
#   /etc/nginx/conf.d/gourde-numerique.conf             (RHEL/CentOS/AlmaLinux)
#
# Activation (Debian/Ubuntu) :
#   ln -s /etc/nginx/sites-available/gourde-numerique.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# ------------------------------------------------------------------

# --- Port 80 : redirige tout vers HTTPS, sauf le challenge ACME Certbot ---
server {
    listen 80;
    listen [::]:80;
    server_name votre-domaine.tld www.votre-domaine.tld;

    location /.well-known/acme-challenge/ {
        root /var/www/gourde-numerique/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Port 443 : le site réel, chiffré ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name votre-domaine.tld www.votre-domaine.tld;

    # DocumentRoot = public/, JAMAIS la racine du projet (config/, *.sql,
    # migrations doivent rester hors de portée du navigateur).
    root /var/www/gourde-numerique/public;
    index index.php;

    # ---------------- TLS ----------------
    # Certificat "réel" (Let's Encrypt, ou fourni par une autorité payante) :
    # ssl_certificate     /etc/letsencrypt/live/votre-domaine.tld/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/votre-domaine.tld/privkey.pem;

    # Certificat auto-signé (développement/tests uniquement — voir
    # deploy/generate-self-signed-cert.sh) :
    ssl_certificate     /etc/ssl/gourde-numerique/server.crt;
    ssl_certificate_key /etc/ssl/gourde-numerique/server.key;

    # Protocoles et suites de chiffrement modernes uniquement.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Indique à l'application (via config/config.php > getenv('FORCE_HTTPS'))
    # que HTTPS est bien en place.
    fastcgi_param FORCE_HTTPS 1;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Ne jamais lister un dossier sans index, ne jamais servir la config/
    # les .sql ou les migrations même si le document root était mal placé.
    autoindex off;
    location ~* \.(sql|md|env|ini|log|bak|swp)$ {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Le back-office /admin a son propre front controller.
    location /admin {
        try_files $uri $uri/ /admin/index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock; # adapter à la version PHP installée
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param FORCE_HTTPS 1;
    }

    location ~ /\. {
        deny all;
    }
}
